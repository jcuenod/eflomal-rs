name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  # Keep in step with the version pinned in ci.yml.
  WASM_PACK_VERSION: 0.13.1

jobs:
  verify:
    name: Verify Rust quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-npm-verify-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-npm-verify-

      - uses: ./.github/actions/rust-quality-gate

  verify-package:
    name: Verify the package builds, type checks and runs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # Built from crates.io rather than piped from the upstream installer; see
      # the note in ci.yml. Nothing here is cached: these jobs run on a tag, so
      # a few minutes of build time is cheaper than trusting a restored binary.
      - name: Install wasm-pack
        run: cargo install --locked wasm-pack@${{ env.WASM_PACK_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build WASM (web)
        run: wasm-pack build eflomal-wasm --release --target web

      - name: Install type checking tools
        run: npm install -g typescript tsx

      - name: Type check (tsc)
        run: tsc --noEmit --strict --skipLibCheck --moduleResolution bundler --module esnext --target es2022 eflomal-wasm/type-check-runtime.ts

      - name: Type check (runtime)
        run: tsx eflomal-wasm/type-check-runtime.ts

      # Everything above tests the build directly. This tests the way it ships:
      # the same build behind the node entry point, resolved through the package
      # name and the "exports" map from a packed tarball.
      - name: Assemble the npm package
        run: |
          cp eflomal-wasm/node.js eflomal-wasm/pkg/node.js
          node eflomal-wasm/apply-package-overrides.mjs eflomal-wasm/pkg "${GITHUB_REF#refs/tags/v}"

      - name: Install the packed tarball and align through it
        run: |
          TARBALL="$(cd eflomal-wasm/pkg && npm pack --silent)"
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/eflomal-wasm/pkg/$TARBALL"
          cp "$GITHUB_WORKSPACE/eflomal-wasm/smoke-test.mjs" .
          node smoke-test.mjs

  publish:
    name: Build and publish WASM package
    needs: [verify, verify-package]
    runs-on: ubuntu-latest
    environment: Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # Deliberately uncached and built from source. This job holds the npm
      # token and id-token: write, and an Actions cache can be written from any
      # branch in the repository, so restoring a prebuilt binary here would
      # hand a cache-poisoning path straight into the publish credentials.
      - name: Install wasm-pack
        run: cargo install --locked wasm-pack@${{ env.WASM_PACK_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Remove deprecated always-auth from npmrc
        run: npm config delete always-auth

      - name: Build WASM package
        run: wasm-pack build eflomal-wasm --release --target web

      - name: Set package name and version
        run: |
          cp eflomal-wasm/node.js eflomal-wasm/pkg/node.js
          node eflomal-wasm/apply-package-overrides.mjs eflomal-wasm/pkg "${GITHUB_REF#refs/tags/v}"

      - name: Verify the package contents
        run: npm pack --dry-run
        working-directory: eflomal-wasm/pkg

      # Works both ways: with an NPM_TOKEN secret it publishes with that token,
      # and without one it falls back to OIDC trusted publishing. The sed is
      # needed because setup-node's registry-url writes an empty `_authToken=`
      # line when NODE_AUTH_TOKEN is unset, and npm reads that as "auth is
      # already configured" and never starts the OIDC exchange.
      # See actions/setup-node#1551.
      - name: Publish to npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          fi
          npm publish --access public
        working-directory: eflomal-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
